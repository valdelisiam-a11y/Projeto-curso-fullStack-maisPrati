services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docflow-backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      B2_KEY_ID: ${B2_KEY_ID:?Defina B2_KEY_ID}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:?Defina B2_APPLICATION_KEY}
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped