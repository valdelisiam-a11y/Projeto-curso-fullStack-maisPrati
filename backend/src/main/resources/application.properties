spring.application.name=backend

# Configuração de porta para produção e desenvolvimento
server.port=${PORT:8080}
server.address=0.0.0.0

# Banco de dados PostgreSQL - Neon
spring.datasource.url=jdbc:postgresql://ep-gentle-tree-b4idm799-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Upload de documentos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Backblaze B2 - DocFlow
b2.endpoint=https://s3.us-east-005.backblazeb2.com
b2.region=us-east-005
b2.bucket-name=docflow-documentos
b2.access-key-id=${B2_KEY_ID}
b2.secret-access-key=${B2_APPLICATION_KEY}